name: Rust
on: [push, pull_request]
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  native-vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev bubblewrap acl
      - run: cargo test --locked --features native-vision
      - run: cargo clippy --locked --all-targets --features native-vision -- -D warnings
      - run: sudo python3 tests/installation_fixture.py --scratch "$PWD/target/installation-fixtures"
