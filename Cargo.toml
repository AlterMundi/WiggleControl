[package]
name = "wigglecontrol"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT AND Apache-2.0"
description = "Camera gesture state and virtual system input"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "=0.13.2"
libc = "=0.2.190"

[features]
native-probe = ["dep:tract-onnx"]
native-ort = ["dep:ort"]
native-vision = ["native-ort", "dep:image", "dep:v4l", "dep:signal-hook"]

[dependencies.tract-onnx]
version = "=0.21.15"
optional = true

[[bin]]
name = "wigglecontrol-model-probe"
path = "src/bin/model_probe.rs"
required-features = ["native-probe"]

[dependencies.ort]
version = "=2.0.0-rc.10"
optional = true
default-features = false
features = ["std", "load-dynamic"]

[[bin]]
name = "wigglecontrol-ort-probe"
path = "src/bin/ort_probe.rs"
required-features = ["native-ort"]

[dependencies.image]
version = "=0.25.5"
optional = true
default-features = false
features = ["jpeg", "png"]

[dependencies.v4l]
version = "=0.14.0"
optional = true

[dependencies.signal-hook]
version = "=0.3.18"
optional = true
