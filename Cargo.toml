[package]
name = "wigglecontrol"
default-run = "wigglecontrol"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT AND Apache-2.0"
exclude = ["tools/labwc/**"]
description = "Camera gesture state and virtual system input"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["float_roundtrip"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "=0.13.2"
libc = "=0.2.190"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Performance", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

windows = { version = "=0.58.0", optional = true, features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Threading"] }

[features]
windows-camera = ["dep:windows", "dep:image"]
native-probe = ["dep:tract-onnx"]
native-ort = ["dep:ort"]
provider-runtime = ["native-ort"]
browser-provider = ["provider-runtime", "windows-camera", "dep:sha2", "dep:v4l", "dep:signal-hook"]
native-vision = ["browser-provider"]

[[bin]]
name = "wigglecontrol-simulate"
path = "src/bin/simulate.rs"

[dependencies.tract-onnx]
version = "=0.21.15"
optional = true

[[bin]]
name = "wigglecontrol-model-probe"
path = "src/bin/model_probe.rs"
required-features = ["native-probe"]

[dependencies.ort]
version = "=2.0.0-rc.10"
optional = true
default-features = false
features = ["std", "load-dynamic"]

[[bin]]
name = "wigglecontrol-ort-probe"
path = "src/bin/ort_probe.rs"
required-features = ["native-ort"]

[dependencies.image]
version = "=0.25.5"
optional = true
default-features = false
features = ["jpeg", "png"]

[target.'cfg(target_os = "linux")'.dependencies.v4l]
version = "=0.14.0"
optional = true

[target.'cfg(target_os = "linux")'.dependencies.signal-hook]
version = "=0.3.18"
optional = true

[dependencies.sha2]
version = "=0.10.9"
optional = true
